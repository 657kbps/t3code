name: Fork release

# Tags and packages this fork on demand. The version comes from the manifests
# plus this fork's own tags and is handed to the builds as --build-version, so a
# release never writes a version into a tracked file: syncing upstream main
# cannot conflict here.

on:
  workflow_dispatch:

permissions:
  contents: write

# Two dispatches would compute the same tag and the second would fail on it.
concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      # Counted after the tag exists, so it only ever grows and no base bump resets it.
      version_code: ${{ steps.release.outputs.version_code }}
    steps:
      # actions/checkout enumerates submodules and dies here: the tree carries
      # gitlinks under .repos/alchemy-effect/submodules with no root .gitmodules.
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          token="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $token"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 --no-tags --no-recurse-submodules origin "$GITHUB_REF"
          git checkout -q --force FETCH_HEAD

      - id: next
        name: Compute the next version
        run: |
          set -euo pipefail
          base="$(jq -r .version apps/server/package.json)"
          next=1
          while read -r tag; do
            n="${tag##*-fork.}"
            if [[ "$n" =~ ^[0-9]+$ ]] && (( n >= next )); then
              next=$((n + 1))
            fi
          done < <(git ls-remote --tags --refs origin "refs/tags/v${base}-fork.*" | sed 's|.*refs/tags/||')

          echo "version=${base}-fork.${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-fork.${next}" >> "$GITHUB_OUTPUT"

      - id: release
        name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          # Rerunning a failed build must not trip over its own release. The tag
          # is what every later job fetches, so test it with git rather than
          # `gh release view`, which reports success for a missing release often
          # enough to leave the tag uncreated.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; reusing it."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "T3 Code $VERSION" \
              --generate-notes
          fi
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null

          # One fork release adds exactly one fork tag, so the count is this
          # build's versionCode. The Android job stamps it into the APK.
          code="$(git ls-remote --tags --refs origin 'refs/tags/v*-fork.*' | wc -l)"
          if (( code < 1 )); then
            echo "No fork tag was found after creating $TAG." >&2
            exit 1
          fi
          echo "version_code=${code}" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI ${{ matrix.key }}
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - key: mac-arm64
            os: macos-15
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: mac-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git init -q .
          token="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $token"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 --no-tags --no-recurse-submodules origin "$REF"
          git checkout -q --force FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      # patchelf: the Linux archive ships libatomic.so.1 and points RUNPATH at it.
      # libsecret: a native module builds against it while bundling.
      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config patchelf

      # The archive takes only this binary from the crate, and the crate changes
      # far less often than the app, so a stored binary skips the cargo build.
      # Same key as the upstream release job, which builds the same artefact.
      - name: Cache the resource monitor
        id: resource_monitor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Build the resource monitor
        if: steps.resource_monitor.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.rust_target }}"
          cargo build --locked --release \
            --manifest-path native/resource-monitor/Cargo.toml \
            --target "${{ matrix.rust_target }}"

      - name: Stage the resource monitor
        run: |
          set -euo pipefail
          binary="t3-resource-monitor"
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/${binary}" "$target_dir/${binary}"

      # t3 --version reads the aligned manifests, and the smoke test compares it
      # with the release version. Nothing here is committed.
      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.tag.outputs.version }}"

      - name: Build the server bundle and the single executable
        run: |
          set -euo pipefail
          vp run build:desktop:bundle
          node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build the archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.tag.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test the archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.tag.outputs.version }}"

      - name: Attach the archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release upload "$TAG" release-cli/* --clobber

  # t3 update verifies an archive against SHA256SUMS in the same release, so the
  # file is regenerated once every CLI archive is published.
  checksums:
    name: Checksums
    needs: [tag, cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p archives
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir archives --clobber \
            --pattern 't3-*'
          cd archives
          shopt -s nullglob
          archives=(t3-*)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives were published." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Android APK
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      VERSION_CODE: ${{ needs.tag.outputs.version_code }}
      # Prebuild stamps versionName and Gradle embeds the app config separately, so both
      # resolve the release version and the updater flag from the same job environment.
      T3CODE_MOBILE_VERSION: ${{ needs.tag.outputs.version }}
      T3CODE_MOBILE_APK_UPDATES: "1"
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git init -q .
          token="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $token"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 --no-tags --no-recurse-submodules origin "$REF"
          git checkout -q --force FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # prebuild deletes apps/mobile/android before regenerating it, so without
      # this every release downloads the Gradle distribution and every
      # dependency again. The wrapper is part of that download.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper
          # No project exists yet, so there is no wrapper jar to validate.
          validate-wrappers: false

      # apps/mobile/android is generated, never tracked, and expo resolves from
      # that package's node_modules/.bin rather than the workspace root. The app
      # version is the store train's, so the release passes its own.
      - name: Prebuild the native project
        working-directory: apps/mobile
        run: vp exec expo prebuild --clean --platform android --no-install

      # Expo writes versionCode as a literal from the app config, which the fork
      # never sets, so every build would otherwise be 1. Patch the generated
      # project and fail here rather than publish an unversioned APK.
      - name: Stamp the version code
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          matches="$(grep -cE '^[[:space:]]*versionCode [0-9]+[[:space:]]*$' app/build.gradle || true)"
          if [[ "$matches" != 1 ]]; then
            echo "Expected one versionCode line in app/build.gradle, found ${matches}." >&2
            exit 1
          fi
          sed -i -E "s/^([[:space:]]*)versionCode [0-9]+[[:space:]]*$/\1versionCode ${VERSION_CODE}/" app/build.gradle
          grep -qE "^[[:space:]]*versionCode ${VERSION_CODE}[[:space:]]*$" app/build.gradle
          grep -Fq "versionName \"${VERSION}\"" app/build.gradle

      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify and attach the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(apps/mobile/android/app/build/outputs/apk/release/*.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No release APK was produced." >&2
            ls -R apps/mobile/android/app/build/outputs >&2 || true
            exit 1
          fi

          # The APK is where the stamped version becomes observable: About reads
          # it back, and the installer compares it, so refuse to publish a mismatch.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          aapt="$(find "$sdk/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          badging="$("$aapt" dump badging "${apks[0]}")"
          badging="${badging%%$'\n'*}"
          if [[ "$badging" != *"versionCode='$VERSION_CODE'"* ]] ||
            [[ "$badging" != *"versionName='$VERSION'"* ]]; then
            echo "APK version does not match the release: $badging" >&2
            exit 1
          fi

          # About only shows the updater in a build that asked for this permission.
          if ! "$aapt" dump permissions "${apks[0]}" |
            grep -q "android.permission.REQUEST_INSTALL_PACKAGES"; then
            echo "The release APK cannot install its own updates." >&2
            exit 1
          fi

          mkdir -p release-apk
          cp "${apks[0]}" "release-apk/T3-Code-${VERSION}-arm64-v8a.apk"
          gh release upload "$TAG" release-apk/* --clobber
