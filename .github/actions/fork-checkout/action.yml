name: Checkout this fork
description: >-
  Fetch one ref without actions/checkout, which enumerates submodules and dies
  on this tree's gitlinks (there is no root .gitmodules for them).

inputs:
  ref:
    description: Ref to fetch and check out. Defaults to the ref that triggered the run.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        git init -q .
        token="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
        git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $token"
        git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        git fetch -q --depth=1 --no-tags --no-recurse-submodules origin "${REF:-$GITHUB_REF}"
        git checkout -q --force FETCH_HEAD
